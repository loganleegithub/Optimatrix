name: Publish final persistent runtime implementation

on:
  push:
    branches:
      - chatgpt/persistent-radar-shadow-web-workbench

permissions:
  contents: write

concurrency:
  group: publish-final-persistent-runtime
  cancel-in-progress: false

jobs:
  publish:
    name: Apply, validate, and publish exact implementation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: chatgpt/persistent-radar-shadow-web-workbench
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.0"
          enable-cache: true
          cache-dependency-glob: requirements-dev.lock
          python-version: "3.13.5"

      - name: Reconstruct and verify exact patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/final-patch.part00 \
              .github/final-patch.part01 \
              .github/final-patch.part02 \
              .github/final-patch.part03 \
              .github/final-patch.part04 > /tmp/final-patch.b64
          echo "0d5b9585cf7568b9fd98615b4c6933c2f3f5b70c2f6ee42327427d5bf8c2ed3f  /tmp/final-patch.b64" | sha256sum --check --strict
          base64 --decode /tmp/final-patch.b64 | gzip --decompress > /tmp/final.patch
          echo "5887d707f2b67510b3e4dfeae1ccaa58f3b44c348e2cb5ede7bc421a83a8ed02  /tmp/final.patch" | sha256sum --check --strict
          git apply --index /tmp/final.patch
          git rm .github/final-patch.part00 \
                 .github/final-patch.part01 \
                 .github/final-patch.part02 \
                 .github/final-patch.part03 \
                 .github/final-patch.part04 \
                 .github/workflows/worktree-bootstrap.yml

      - name: Verify exact scope and immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          BASE=967e82ea36a7fcae13c6c8a8b07108af5b21a633
          cat > /tmp/expected-files.txt <<'EOF'
          apps/radar_runtime/src/radar_runtime/__main__.py
          apps/radar_runtime/src/radar_runtime/fixed_contract_shadow.py
          apps/radar_runtime/src/radar_runtime/runtime.py
          apps/radar_runtime/src/radar_runtime/service.py
          apps/radar_runtime/src/radar_runtime/service_evidence.py
          apps/radar_runtime/src/radar_runtime/workbench.py
          docs/architecture/PERSISTENT_RUNTIME_TRADER_WORKBENCH.md
          docs/authority/CURRENT_STAGE.md
          docs/authority/SYSTEM_ARCHITECTURE.md
          docs/contracts/SHORT_VOL_PERSISTENT_PUBLIC_SHADOW_SERVICE.md
          packages/short_vol_radar/src/short_vol_radar/evidence.py
          packages/short_vol_underwriting/src/short_vol_underwriting/validation.py
          tasks/SHORT_VOL_PERSISTENT_RUNTIME_TRADER_WORKBENCH.md
          tests/test_authority_and_architecture.py
          tests/test_persistent_service.py
          tests/test_trader_workbench.py
          EOF
          git diff --cached --name-only "$BASE" | sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          git diff --cached --check
          git diff --cached --stat "$BASE"
          git diff --cached --name-status "$BASE"
          echo "b9733ad0c90837338b88fb5b6eb66ad8eed448cce6372a3f527988395087b3fe  docs/contracts/SHORT_VOL_RADAR.md" | sha256sum --check --strict
          echo "9cbaecf57fb1db0dedf782a4ab002b655e43319a1ad7c5880db3d7b4682d4b03  docs/contracts/SHORT_VOL_UNDERWRITING_POSITION.md" | sha256sum --check --strict
          echo "61a032fe0fe265d66a38bcbb1a3c8498409664fedbda2c8bd0a245180581a695  docs/contracts/SHORT_VOL_SHADOW_OUTCOME_FORWARD_COHORT.md" | sha256sum --check --strict
          echo "2bcb780e6a9bab0982e59a70929e0150f1113d39452fcdb35894e293431f93d4  policies/short-vol-fixed-public-shadow-radar.json" | sha256sum --check --strict
          echo "be056d7fad71668954103e1e383372c3b03db9b27b8d03ce0a030d39285629af  policies/short-vol-fixed-public-shadow-underwriting.json" | sha256sum --check --strict
          echo "498a298be50cb356f43886ae7ba02d1f6da065233ae9b2b52e9a230cf7f9c439  policies/short-vol-fixed-public-shadow-position.json" | sha256sum --check --strict

      - name: Install exact development toolchain
        run: make sync

      - name: Run focused direct behavior tests
        run: .venv/bin/python -m pytest tests/test_persistent_service.py tests/test_trader_workbench.py

      - name: Run repository checks
        run: make check

      - name: Commit and non-force push final tree
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all | grep -v '^M  ' || true)" || git status --short
          EXPECTED_TREE=a4128bc2162e0a0f535e7fb0e6b1ec2edb04283b
          STAGED_TREE=$(git write-tree)
          echo "STAGED_TREE=$STAGED_TREE"
          test "$STAGED_TREE" = "$EXPECTED_TREE"
          git config user.name "OpenAI ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Implement persistent public Shadow service and workbench"
          FINAL_HEAD=$(git rev-parse HEAD)
          FINAL_TREE=$(git rev-parse 'HEAD^{tree}')
          echo "FINAL_HEAD=$FINAL_HEAD"
          echo "FINAL_TREE=$FINAL_TREE"
          test "$FINAL_TREE" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin HEAD:refs/heads/chatgpt/persistent-radar-shadow-web-workbench
