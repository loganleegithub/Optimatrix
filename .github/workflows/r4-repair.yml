name: Diagnose R4 repair payload

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out exact task branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/r4-commissioning-integrity-repair
          fetch-depth: 0

      - name: Print every materialization identity
        shell: bash
        run: |
          set -euxo pipefail
          sha256sum \
            .github/r4_apply.part00 \
            .github/r4_apply.part01 \
            .github/r4_apply.part02 \
            .github/r4_apply.part03 \
            .github/r4_apply.part04
          wc -c \
            .github/r4_apply.part00 \
            .github/r4_apply.part01 \
            .github/r4_apply.part02 \
            .github/r4_apply.part03 \
            .github/r4_apply.part04
          cat \
            .github/r4_apply.part00 \
            .github/r4_apply.part01 \
            .github/r4_apply.part02 \
            .github/r4_apply.part03 \
            .github/r4_apply.part04 \
            > .github/r4_apply.py.gz.b64
          sha256sum .github/r4_apply.py.gz.b64
          wc -c .github/r4_apply.py.gz.b64
          base64 --decode .github/r4_apply.py.gz.b64 > /tmp/r4_apply.py.gz
          sha256sum /tmp/r4_apply.py.gz
          wc -c /tmp/r4_apply.py.gz
          gzip --test --verbose /tmp/r4_apply.py.gz
          gzip --decompress --stdout /tmp/r4_apply.py.gz > .github/r4_apply.py
          sha256sum .github/r4_apply.py
          wc -c .github/r4_apply.py
          python -m py_compile .github/r4_apply.py
