name: Export exact source snapshot

on:
  pull_request:
    paths:
      - .github/workflows/export-source.yml

permissions:
  contents: read

jobs:
  export:
    name: Export source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check out exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build source archive
        run: tar --exclude=.git -czf /tmp/optimatrix-source.tgz .

      - name: Upload source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: optimatrix-source-${{ github.sha }}
          path: /tmp/optimatrix-source.tgz
          retention-days: 1
          if-no-files-found: error
