name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.0"
          enable-cache: true
          cache-dependency-glob: requirements-dev.lock
          python-version: "3.13.5"

      - name: Install exact development toolchain
        run: make sync

      - name: Archive exact synchronized checkout for implementation worktree
        run: tar --exclude=.git/logs --exclude=.git/objects/pack -czf /tmp/optimatrix-synchronized-checkout.tgz .

      - name: Upload exact synchronized checkout artifact
        uses: actions/upload-artifact@v7
        with:
          name: optimatrix-synchronized-checkout-${{ github.event.pull_request.head.sha }}
          path: /tmp/optimatrix-synchronized-checkout.tgz
          archive: false
          retention-days: 1

      - name: Run repository checks
        run: make check
