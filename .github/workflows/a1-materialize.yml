name: A1 materialize exact candidate

on:
  push:
    branches:
      - agent/short-vol-radar-steady-state-knownness

permissions:
  contents: write

jobs:
  materialize:
    name: Materialize validated A1 source
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out exact branch tip
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Verify and materialize exact files
        shell: bash
        run: |
          set -euo pipefail
          echo "6a018eb72f88203d461e8657effdb31231e16e88259c1c727bc8668b6b359069  .github/a1-missing-files.tar.gz" | sha256sum -c -
          tar -xzf .github/a1-missing-files.tar.gz
          git rm -- .github/a1-missing-files.tar.gz .github/workflows/a1-materialize.yml
          git add -- \
            apps/radar_runtime/src/radar_runtime/funnel.py \
            tests/test_funnel.py \
            tests/test_radar_knownness_observation.py \
            tests/test_authority_and_architecture.py
          git diff --cached --check

      - name: Publish clean append-only candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Implement Radar steady-state knownness"
          git push origin HEAD:agent/short-vol-radar-steady-state-knownness
