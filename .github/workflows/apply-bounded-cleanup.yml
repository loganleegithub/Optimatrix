name: Apply bounded completed-state cleanup

on:
  pull_request:
    paths:
      - .github/workflows/apply-bounded-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    name: Verify, apply, and publish cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify staging boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain --untracked-files=all)"
          actual="$(git diff --name-only 1290eddf6c082c9f502aacb973bd1c84989451b3..HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/cleanup.patch.part00 \
            .github/cleanup.patch.part01 \
            .github/cleanup.patch.part02 \
            .github/workflows/apply-bounded-cleanup.yml \
            .github/workflows/export-sandbox-source.yml | LC_ALL=C sort)"
          test "$actual" = "$expected"

      - name: Correct the one proven transport byte
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/cleanup.patch.part01")
          value = path.read_bytes()
          polluted = b"kweeted0k6"
          exact = b"ketted0k6"
          if value.count(polluted) != 1 or exact in value:
              raise SystemExit("unexpected cleanup part01 transport shape")
          path.write_bytes(value.replace(polluted, exact, 1))
          PY

      - name: Verify and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          echo "2432f70a9e4c422b36f4c8bac3731ea6b2e7cc4227776327059661e0ff8ead2b  .github/cleanup.patch.part00" | sha256sum -c -
          echo "e2f550168a3952e5199c424e387809bbc18eb06088cf4ac84d90dd88b5f11ece  .github/cleanup.patch.part01" | sha256sum -c -
          echo "e101bccc9a8c7cc76d0fdd83d391770e2b2aaec1cee7d3e432cfd4b7c2159ea0  .github/cleanup.patch.part02" | sha256sum -c -
          cat .github/cleanup.patch.part00 .github/cleanup.patch.part01 .github/cleanup.patch.part02 > /tmp/cleanup.patch.b64
          echo "8aea83f53a5f23362699dd27283700a2a1c7bbb6d4a1ab34bfdcb927106824ad  /tmp/cleanup.patch.b64" | sha256sum -c -
          base64 --decode /tmp/cleanup.patch.b64 | gzip --decompress > /tmp/optimatrix-cleanup.patch
          echo "fa7a904e581ccd31d1a17e7d33ecb6abef96100f207db9607a593d5e1778eb8e  /tmp/optimatrix-cleanup.patch" | sha256sum -c -
          git apply --check /tmp/optimatrix-cleanup.patch
          git apply --index /tmp/optimatrix-cleanup.patch
          git rm .github/cleanup.patch.part00 .github/cleanup.patch.part02 .github/workflows/apply-bounded-cleanup.yml
          git rm -f .github/cleanup.patch.part01
          test ! -e .github/workflows/export-sandbox-source.yml
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)" = "ci.yml"

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.0"
          enable-cache: true
          cache-dependency-glob: requirements-dev.lock
          python-version: "3.13.5"

      - name: Install exact development toolchain
        run: make sync

      - name: Apply exact static and type fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected replacement boundary: {path_name}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          test_file = Path("tests/test_short_vol_underwriting.py")
          text = test_file.read_text(encoding="utf-8")
          future = "from __future__ import annotations\n\n"
          mapping_import = "from collections.abc import Mapping\n"
          if mapping_import in text or text.count(future) != 1:
              raise SystemExit("unexpected Mapping import boundary")
          test_file.write_text(
              text.replace(future, future + mapping_import + "\n", 1),
              encoding="utf-8",
          )

          evidence = "packages/short_vol_underwriting/src/short_vol_underwriting/evidence.py"
          replace_once(
              evidence,
              "            scope = self._scope_by_availability.get(availability)\n"
              "            if scope is None:\n"
              "                raise ShadowStateError(\"Underwriting action lacks its current availability scope\")\n"
              "            return \"scope\", scope\n",
              "            owning_scope = self._scope_by_availability.get(availability)\n"
              "            if owning_scope is None:\n"
              "                raise ShadowStateError(\"Underwriting action lacks its current availability scope\")\n"
              "            return \"scope\", owning_scope\n",
          )
          replace_once(
              evidence,
              "            entry = self._entry_by_post_close_attempt.get(scheduled)\n"
              "            if entry is None:\n"
              "                raise ShadowStateError(\"post-CLOSE terminal lacks its current Case\")\n"
              "            return \"entry\", entry\n",
              "            owning_entry = self._entry_by_post_close_attempt.get(scheduled)\n"
              "            if owning_entry is None:\n"
              "                raise ShadowStateError(\"post-CLOSE terminal lacks its current Case\")\n"
              "            return \"entry\", owning_entry\n",
          )
          replace_once(
              evidence,
              "            entry = self._entry_by_observation.get(observation)\n"
              "            if entry is None:\n"
              "                raise ShadowStateError(\"selected exit lacks its current Case observation\")\n"
              "            return \"entry\", entry\n",
              "            owning_entry = self._entry_by_observation.get(observation)\n"
              "            if owning_entry is None:\n"
              "                raise ShadowStateError(\"selected exit lacks its current Case observation\")\n"
              "            return \"entry\", owning_entry\n",
          )

          funnel = "apps/radar_runtime/src/radar_runtime/funnel.py"
          replace_once(
              funnel,
              "                if candidate is not None:\n"
              "                    if not state.candidate:\n"
              "                        state.candidate = True\n"
              "                        self._candidate_episode_count += 1\n"
              "                    self._candidate_episode_by_identity[candidate] = episode\n",
              "                if candidate is not None and episode is not None:\n"
              "                    if not state.candidate:\n"
              "                        state.candidate = True\n"
              "                        self._candidate_episode_count += 1\n"
              "                    self._candidate_episode_by_identity[candidate] = episode\n",
          )
          replace_once(
              funnel,
              "                if entry is not None:\n"
              "                    if not state.case_opened:\n"
              "                        state.case_opened = True\n"
              "                        self._case_opened_count += 1\n"
              "                    state.entry_identity = entry\n"
              "                    self._entry_episode_by_identity[entry] = episode\n",
              "                if entry is not None and episode is not None:\n"
              "                    if not state.case_opened:\n"
              "                        state.case_opened = True\n"
              "                        self._case_opened_count += 1\n"
              "                    state.entry_identity = entry\n"
              "                    self._entry_episode_by_identity[entry] = episode\n",
          )
          replace_once(
              funnel,
              "                outcome_episode = self._entry_episode_by_identity.pop(entry or \"\", None)\n",
              "                if entry is None:\n"
              "                    outcome_episode = None\n"
              "                else:\n"
              "                    outcome_episode = self._entry_episode_by_identity.pop(entry, None)\n",
          )
          replace_once(
              funnel,
              "            if state.entry_identity is not None:\n"
              "                self._entry_episode_by_identity.pop(state.entry_identity, None)\n",
              "            entry_identity = state.entry_identity\n"
              "            if entry_identity is not None:\n"
              "                self._entry_episode_by_identity.pop(entry_identity, None)\n",
          )

          workbench = "apps/radar_runtime/src/radar_runtime/workbench.py"
          replace_once(
              workbench,
              "        if expiry_ms is None and isinstance(leg_ids, list):\n"
              "            expiries = {\n"
              "                expiry_by_leg.get(str(identity))\n"
              "                for identity in leg_ids\n"
              "                if expiry_by_leg.get(str(identity)) is not None\n"
              "            }\n"
              "            if len(expiries) == 1:\n"
              "                expiry_ms = next(iter(expiries))\n",
              "        if expiry_ms is None and isinstance(leg_ids, list):\n"
              "            expiries: set[int] = set()\n"
              "            for identity in leg_ids:\n"
              "                leg_expiry = expiry_by_leg.get(str(identity))\n"
              "                if isinstance(leg_expiry, int):\n"
              "                    expiries.add(leg_expiry)\n"
              "            if len(expiries) == 1:\n"
              "                expiry_ms = next(iter(expiries))\n",
          )

          fact_test = Path("tests/test_fact_boundary_business.py")
          text = fact_test.read_text(encoding="utf-8")
          old_assertion = "    assert reducer.event_sink.anomalies == ()\n"
          if text.count(old_assertion) != 3:
              raise SystemExit("unexpected anomaly assertion count")
          fact_test.write_text(
              text.replace(old_assertion, "    assert not reducer.event_sink.anomalies\n"),
              encoding="utf-8",
          )
          PY

          .venv/bin/python -m ruff check --fix --unsafe-fixes \
            apps/radar_runtime/src/radar_runtime/workbench.py \
            packages/short_vol_underwriting/src/short_vol_underwriting/owner.py \
            tests/test_short_vol_underwriting.py

          files=(
            apps/radar_runtime/src/radar_runtime/fixed_contract_shadow.py
            apps/radar_runtime/src/radar_runtime/funnel.py
            apps/radar_runtime/src/radar_runtime/workbench.py
            packages/short_vol_underwriting/src/short_vol_underwriting/evidence.py
            packages/short_vol_underwriting/src/short_vol_underwriting/owner.py
            tests/test_fact_boundary_business.py
            tests/test_fixed_contract_shadow.py
            tests/test_short_vol_underwriting.py
          )
          .venv/bin/python -m ruff format "${files[@]}"
          git add "${files[@]}"

      - name: Run repository checks
        run: make check

      - name: Verify final scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --check
          test -z "$(git status --porcelain --untracked-files=all | grep '^??' || true)"
          ! grep -R -n -E 'Rejected|rejected|cohort_enrolled|AlignedPair|RejectedAnchor|_create_rejected_trade|REJECTED_COUNTERFACTUAL' apps packages --include='*.py'
          test ! -e tasks/SHORT_VOL_RUNTIME_COMPLETED_STATE_EVICTION.md
          test ! -e packages/short_vol_underwriting/src/short_vol_underwriting/cohort.py
          test -e packages/short_vol_underwriting/src/short_vol_underwriting/observation.py

      - name: Commit and push exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "refactor: bound completed runtime state"
          git push origin HEAD:agent/shadow-case-data-boundary
