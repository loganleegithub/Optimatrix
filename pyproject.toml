[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "optimatrix"
# Required distribution metadata; it is not a product generation or authority identity.
version = "0.0.0"
description = "Deribit BTC 0-3DTE defined-risk Short Vol Radar"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = ["websockets==16.1.1"]

[tool.setuptools]
packages = [
  "market_monitor",
  "options_domain",
  "short_vol_radar",
  "radar_runtime",
]

[tool.setuptools.package-dir]
market_monitor = "packages/market_monitor/src/market_monitor"
options_domain = "packages/options_domain/src/options_domain"
short_vol_radar = "packages/short_vol_radar/src/short_vol_radar"
radar_runtime = "apps/radar_runtime/src/radar_runtime"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-q"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["packages", "apps", "tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "UP"]
