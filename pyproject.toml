[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "optimatrix-btc-0dte"
version = "0.1.0"
description = "Deribit inverse BTC 0DTE two-sided premium-sale Shadow core"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = []

[project.scripts]
optimatrix-shadow = "optimatrix.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["optimatrix"]

[tool.setuptools.package-data]
optimatrix = ["data/*.json", "workbench_static/*"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-q"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "UP"]
