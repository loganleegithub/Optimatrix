name: ChatGPT bootstrap source snapshot

on:
  push:
    branches:
      - chatgpt/persistent-radar-shadow-web-workbench
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    name: Export exact source and locked toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.0"
          enable-cache: true
          cache-dependency-glob: requirements-dev.lock
          python-version: "3.13.5"

      - name: Install exact development toolchain
        run: make sync

      - name: Build source and site-packages archives
        run: |
          tar --exclude=.git -czf /tmp/optimatrix-source.tar.gz .
          tar -C .venv/lib/python3.13 -czf /tmp/optimatrix-site-packages.tar.gz site-packages

      - name: Upload source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: optimatrix-source
          path: /tmp/optimatrix-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Upload locked site-packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: optimatrix-site-packages
          path: /tmp/optimatrix-site-packages.tar.gz
          if-no-files-found: error
          retention-days: 1
